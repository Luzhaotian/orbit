<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" role="img" aria-label="Orbit">
  <!-- Solid ink silhouette so dark-theme invert becomes a clean white lockup. -->
  <g transform="translate(24,24)" fill="#0f172a" stroke="#0f172a">
    <ellipse cx="0" cy="0" rx="20" ry="7.5" fill="none" stroke-width="2.4" transform="rotate(-32)" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="11" fill="#0f172a" stroke="none"/>
    <circle cx="15.5" cy="-8.2" r="3.4" fill="#0f172a" stroke="none"/>
  </g>
  <text x="52" y="33" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="28" font-weight="700" letter-spacing="-0.6" fill="#0f172a">Orbit</text>
</svg>
