<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-label="Orbit">
  <title>Orbit</title>
  <defs>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f7ff"/>
      <stop offset="45%" stop-color="#9eb6ff"/>
      <stop offset="100%" stop-color="#4f6fe8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5d6ff"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="type" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <g transform="translate(80,80)">
    <ellipse cx="0" cy="0" rx="48" ry="18" fill="none" stroke="url(#ring)" stroke-width="4" transform="rotate(-32)" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="26" fill="url(#orb)"/>
    <circle cx="-6" cy="-5" r="7" fill="#ffffff" opacity="0.35"/>
    <circle cx="36" cy="-18" r="7.5" fill="url(#orb)"/>
    <circle cx="36" cy="-18" r="3" fill="#f8fbff"/>
  </g>
  <text x="160" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="72" font-weight="700" letter-spacing="-1.2" fill="url(#type)">Orbit</text>
</svg>
