<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-label="Orbit">
  <title>Orbit</title>
  <defs>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="type" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- O mark: planet + orbital ring + satellite -->
  <g transform="translate(80,80)">
    <ellipse cx="0" cy="0" rx="46" ry="18" fill="none" stroke="url(#orb)" stroke-width="3.5" transform="rotate(-28)" opacity="0.95"/>
    <circle cx="0" cy="0" r="26" fill="url(#orb)"/>
    <circle cx="-7" cy="-5" r="7" fill="#e0f2fe" opacity="0.35"/>
    <circle cx="34" cy="-16" r="6" fill="#7dd3fc"/>
    <circle cx="34" cy="-16" r="2.5" fill="#f0f9ff"/>
  </g>
  <text x="160" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="72" font-weight="700" letter-spacing="-1.2" fill="url(#type)">Orbit</text>
</svg>
